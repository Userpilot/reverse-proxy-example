worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS resolver. Userpilot's backend IPs rotate, and
    # community nginx only resolves a hostname hardcoded in proxy_pass once
    # at startup — storing the hostname in a variable forces re-resolution
    # on this resolver's TTL instead.
    resolver 127.0.0.11 valid=30s;

    # Logs the exact URL nginx forwarded upstream (via $proxied_url, set per
    # location below) alongside the incoming request and response status —
    # the fastest way to see whether a path is being built correctly.
    log_format proxied '$time_iso8601 $remote_addr "$request" -> "$proxied_url" '
                        'status=$status upstream_status=$upstream_status';
    access_log /dev/stdout proxied;
    error_log /dev/stderr info;

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        # Local dev cert (mkcert) — the SDK forces wss:// for the events
        # socket regardless of the page's own protocol, so a plain HTTP
        # listener can't complete that handshake. See README "Local test
        # with TLS".
        ssl_certificate /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

        root /usr/share/nginx/html;

        # Default for the log_format above on non-proxied locations (e.g. /)
        set $proxied_url "-";

        location / {
            index test.html;
        }

        # SDK script CDN
        location /sdk/ {
            set $sdk_upstream js.userpilot.io;
            # proxy_pass URIs are opaque when the host is a variable — nginx
            # skips its usual "replace matched location prefix" rewrite, so
            # the real request path/query must be appended explicitly or
            # every request resolves to the literal /sdk/ path above.
            set $proxied_url https://$sdk_upstream$request_uri;
            proxy_pass $proxied_url;
            proxy_set_header Host $sdk_upstream;

            # Cloudflare-fronted upstream requires SNI on the proxied TLS
            # handshake, otherwise it fails with SSL alert 40
            proxy_ssl_server_name on;
            proxy_ssl_name $sdk_upstream;

            # Strip end-user IP so it never reaches Userpilot
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Client-IP "";
            proxy_hide_header X-Forwarded-For;
        }

        # Realtime events websocket
        location /userpilot/websocket {
            set $events_upstream analytex.userpilot.io;
            # Same opaque-URI gotcha as /sdk/ above — the upstream path here
            # (/v1/events/websocket) differs from our local path, so only
            # the query string needs to be forwarded, not $request_uri.
            set $proxied_url https://$events_upstream/v1/events/websocket$is_args$args;
            proxy_pass $proxied_url;
            proxy_set_header Host $events_upstream;

            # Websocket upgrade
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cloudflare-fronted upstream requires SNI on the proxied TLS
            # handshake, otherwise it fails with SSL alert 40
            proxy_ssl_server_name on;
            proxy_ssl_name $events_upstream;

            # Strip end-user IP so it never reaches Userpilot
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Client-IP "";
            proxy_hide_header X-Forwarded-For;
        }
    }
}
